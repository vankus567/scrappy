[package]
name = "scrappy-arcade"
version = "0.1.0"
description = "SCRAPPY BOY arcade program: on-chain save cards and scoped session delegates"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "scrappy_arcade"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
