<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Console dev</title>
    <style>
      :root { --floor: #14120f; --ink: #e9e2d6; --dim: #8a8174; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--floor); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
      body { display: grid; grid-template-rows: 1fr auto; overscroll-behavior: none; touch-action: manipulation; }
      #stage { display: grid; place-items: center; min-height: 0; padding: 16px; user-select: none; -webkit-user-select: none; }
      #bar { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); color: var(--dim); font-size: 12px; }
      #bar b { color: var(--ink); font-weight: 600; }
    </style>
  </head>
  <body>
    <main id="stage"></main>
    <div id="bar"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
